<script>
    class Employee {
        id =101;
        name ="John Doe";
        sal = 5000;

        displayInfo1(){ //normal function: this= how it is called, this = Employee object
            console.log(this.id, this.name, this.sal)

        }
        displayInfo2 =()=> {//Arrow function: this = where it is written, this = Employee object
            console.log(this.id, this.name, this.sal)
        }
    }
    let emp = new Employee();
    emp.displayInfo1();
    emp.displayInfo2();
</script>
