<script>
    //primitive data types
    var a = 10;
    var b =10;
    console.log(a==b); //true (compares values)

    var str1 = 'hello';
    var str2 = 'hello';
    console.log(str1==str2); //true (compares values)

    //non-primitive data types
    let obj1 = {name : 'sachin', age : 30};
    let obj2 = {name : 'sachin', age : 30};
    console.log(obj1==obj2); //false (compares references, they are different objects in memory and storedat different locations in heap)

    let arr1 = [1,2,3];
    let arr2 = [1,2,3]; 
    console.log(arr1==arr2); //false (compares references, they are different arrays in memory and stored at different locations in heap)

    </script>
